# Торговая конфигурация по умолчанию.
# Режим работы и ключи API задаются переменными окружения TB_* (см. .env.example).
#
# Стратегия — дневной тренд «лонг или кэш» на споте: единственная из ~25 проверенных, давшая
# устойчивый результат вне выборки (docs/research-strategies.md, docs/strategy-selection.md).
# Внутридневные стратегии (скальпинг, SMC, пробои) после комиссий и честной симуляции
# преимущества не показали и из бота убраны.

markets:
  crypto:
    enabled: true
    market_type: crypto
    category: spot  # спот Bybit: комиссия 0.1%, без плеча и шортов
    # Монеты, на которых стратегия проверялась (8 из исследования, доступные на споте Bybit)
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, TRXUSDT, BCHUSDT]
  stocks:
    # Акции через Alpaca. Стратегия на акциях НЕ проверялась, поэтому рынок выключен
    # и включить его конфигурация не даст.
    enabled: false
    market_type: stock
    broker: alpaca
    category: stock
    symbols: [AAPL, MSFT, NVDA, AMZN, SPY]

risk:
  # conservative (целевая волатильность 15%) | moderate (25%, проверенная) |
  # aggressive (40%) | custom (target_vol_pct задаётся вручную)
  profile: moderate
  max_weight_pct: 100         # предел доли одной монеты, % капитала
  max_drawdown_stop_pct: 0    # продать всё и остановиться при такой просадке (0 — выключено)

strategy:
  name: trend
  lookbacks: [20, 60, 120]    # горизонты тренда, дней
  vol_lookback: 30            # окно волатильности, дней
  rebalance_weekday: 0        # ребалансировка по понедельникам (0 — пн, 6 — вс; UTC)
  btc_filter: false           # держать монеты только когда BTC выше 200-дневной средней
  btc_ma_days: 200
  min_trade_pct: 1.0          # не торговать изменения доли меньше 1% капитала
